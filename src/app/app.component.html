<mat-toolbar class="app-toolbar">
  <a class="brand" routerLink="/"><span class="brand-mark">R</span><span>RTS Application</span></a>
  <nav class="main-nav" aria-label="Main navigation">
    <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Landing</a>
    @if (auth.isAuthenticated()) {
    <a mat-button routerLink="/search" routerLinkActive="active">Ticker search</a>
    }
  </nav>
  <span class="toolbar-spacer"></span>
  @if (auth.user(); as user) {
  <a class="user-link" routerLink="/profile"><mat-icon>account_circle</mat-icon><span>{{ user.username
      }}</span></a><button mat-stroked-button class="logout-button" type="button" (click)="logout()">
    <mat-icon>logout</mat-icon>Log out
  </button>
  } @else {
  <a mat-flat-button color="primary" routerLink="/auth">Log in / Sign up</a>
  }
</mat-toolbar>
<main class="page-shell"><router-outlet /></main>
